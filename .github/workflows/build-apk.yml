name: Compila APK

on:
  push:
    branches: [main]
    # le sole modifiche alle guide non creano un nuovo APK
    paths-ignore: ['**.md']
  workflow_dispatch:

# se arrivano due modifiche di fila si compila solo l'ultima
concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HA_CHIAVE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Senza chiave di firma non si pubblica
        if: env.HA_CHIAVE != 'true'
        run: |
          echo "::error::Mancano i Secrets della chiave di firma (vedi COME-OTTENERE-APK.md)."
          echo "Un APK firmato con una chiave diversa non si installerebbe sopra l'app già presente: per questo la compilazione si ferma qui." | tee "$RUNNER_TEMP/build.log"
          exit 1

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Controlli automatici dell'app (archivio, backup, allergeni, PDF)
        run: |
          set -o pipefail
          pip install --quiet playwright
          python -m playwright install --with-deps chromium > /dev/null
          python tests/test_app.py 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Prepara Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copia l'app web dentro il progetto Android
        run: |
          DEST=android/app/src/main/assets
          mkdir -p "$DEST"
          cp index.html manifest.webmanifest "$DEST"/
          cp -r assets icons vendor css js "$DEST"/
          # il service worker non serve dentro l'APK: i file sono già sul telefono
          echo "File inclusi nell'APK:" && du -sh "$DEST"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepara la chiave di firma (se configurata nei Secrets)
        if: env.HA_CHIAVE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/menu.keystore"

      - name: Compila l'APK
        working-directory: android
        env:
          MENU_KEYSTORE: ${{ env.HA_CHIAVE == 'true' && format('{0}/menu.keystore', runner.temp) || '' }}
          MENU_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          MENU_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          MENU_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: set -o pipefail; gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Se la compilazione fallisce, apri una issue con l'errore
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo 'Build ${{ github.run_number }} non riuscita.'; echo; echo '```'
            tail -c 50000 "$RUNNER_TEMP/build.log" || echo 'log non disponibile'
            echo '```'; } > "$RUNNER_TEMP/errore.md"
          gh issue create --title "Build ${{ github.run_number }} fallita" --body-file "$RUNNER_TEMP/errore.md"

      - name: Mostra con quale chiave è firmato l'APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/*.apk | grep -E "Signer #1 certificate (DN|SHA-256)" || echo "Firma non leggibile (non bloccante)"

      - name: Rinomina l'APK con il numero di build
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk "dist/menu-tenuta-coppa-build-${{ github.run_number }}.apk"
          ls -lh dist/

      - name: Pubblica l'APK come Release (download diretto dal telefono)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Versione 1.${{ github.run_number }}
          body: |
            App Menù Tenuta Coppa.
            Commit: ${{ github.sha }}
            ${{ github.event.head_commit.message }}
          files: dist/*.apk
          make_latest: true

      - name: Tieni solo le ultime 5 versioni pubblicate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[5:] | .[].tagName' \
          | while read -r tag; do
              [ -n "$tag" ] && gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
            done

      - name: Conserva anche l'artifact (backup)
        uses: actions/upload-artifact@v4
        with:
          name: menu-tenuta-coppa-apk
          path: dist/*.apk
          retention-days: 7
