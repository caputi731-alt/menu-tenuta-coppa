<style>
:root{--paper:#FAFAF6;--ink:#22281F;--muted:#6B7064;--line:#DEDFD5;--olive:#4E5B31;--olive-2:#3E4926;--olive-soft:#E9ECDF;--wine:#7B2D3B;--r:14px;--sb:env(safe-area-inset-bottom,0px);--st:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.45 Figtree,system-ui,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--olive);outline-offset:2px}
#app{position:relative;z-index:0;background:var(--paper);min-height:100vh}
#rh{position:fixed;left:0;top:0;z-index:-1;pointer-events:none}

.top{position:sticky;top:0;z-index:20;background:rgba(250,250,246,.93);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:calc(var(--st) + 8px) 12px 8px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:4px;min-height:58px}
.top h1{font:italic 500 30px/1.1 'Cormorant Garamond',Georgia,serif;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ib:first-child{margin-left:-10px}
.main{padding:16px 16px calc(110px + var(--sb));max-width:720px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + var(--sb))}
.nav button{flex:1;border:0;background:none;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.nav button.on{color:var(--olive);font-weight:600}
.nav svg{width:24px;height:24px}
.fab{position:fixed;right:18px;bottom:calc(80px + var(--sb));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--olive);color:#fff;box-shadow:0 6px 18px rgba(62,73,38,.35);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

.ib{border:0;background:none;width:40px;height:40px;display:grid;place-items:center;border-radius:10px;color:var(--muted);flex:none;padding:0}
.ib svg{width:21px;height:21px}
.ib:active{background:var(--olive-soft)}
.tb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600;color:var(--olive-2)}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:19px;height:19px}
.btn.pri{background:var(--olive);color:#fff;border-color:var(--olive)}
.btn.danger{color:var(--wine)}
.btn.wide{width:100%}
.btns{display:grid;gap:8px}
.btns.two{grid-template-columns:1fr 1fr}

.grp{margin:0 0 24px}
.grp>h2{font:600 14px/1.2 Figtree,sans-serif;color:var(--muted);margin:0 0 8px 2px}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px}
.fld{display:block;margin-bottom:12px}
.fld>span{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:46px}

.inp:focus{border-color:var(--olive);box-shadow:0 0 0 3px var(--olive-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:13px;color:var(--muted);margin:4px 2px 0}
.tog{display:flex;align-items:center;gap:10px;padding:8px 2px;font-size:15px}
.tog input{width:20px;height:20px;accent-color:var(--olive);flex:none}
.empty{color:var(--muted);text-align:center;padding:22px 10px;font-size:15px}

.seg{display:flex;background:var(--olive-soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--olive-2)}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.stat{display:flex;flex-wrap:wrap;gap:8px}
.stat button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;display:flex;align-items:center;gap:7px}
.stat button i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.stat button.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff);font-weight:600}

.calh{display:flex;align-items:center;gap:4px;margin-bottom:10px}
.calh h2{flex:1;margin:0;font:italic 500 26px/1.1 'Cormorant Garamond',Georgia,serif}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wk span{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.day{aspect-ratio:1/1.08;background:#fff;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:0;border:1px solid var(--line)}
.day .dn{font-size:15px;font-weight:500}
.day .dots{display:flex;gap:3px;height:6px;align-items:center}
.day .dots i{width:6px;height:6px;border-radius:50%}
.day .dots em{font-style:normal;font-size:10px;line-height:6px;color:var(--muted)}
.day.today .dn{color:var(--wine);font-weight:700}
.day.sel{border-color:var(--olive);background:var(--olive-soft)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin:10px 2px 20px;font-size:12px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%}
.dh{font:italic 500 22px/1.2 'Cormorant Garamond',Georgia,serif;margin:0 0 10px 2px}

.mcard{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;text-align:left;margin-bottom:8px}
.mc-date{width:50px;flex:none;text-align:center;border-right:2px solid var(--ac);padding-right:10px}
.mc-date b{display:block;font:500 28px/1 'Cormorant Garamond',Georgia,serif}
.mc-date small{font-size:12px;color:var(--muted)}
.mc-bar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.mc-body{flex:1;min-width:0}
.mc-t{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-s{display:block;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;color:var(--c);background:color-mix(in srgb,var(--c) 13%,#fff);flex:none}

.tchips{display:flex;gap:10px;overflow-x:auto;margin:0 -16px 20px;padding:4px 16px 6px;scrollbar-width:none}
.tchips::-webkit-scrollbar{display:none}
.tchip{flex:none;width:88px;border:0;background:none;padding:0;text-align:center;font-size:13px;line-height:1.25}
.sw{display:grid;place-items:center;height:106px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;background-size:cover;background-position:center}
.sw img{width:62px}
.tchip.on .sw{outline:2.5px solid var(--olive);outline-offset:2px}
.tchip.on{font-weight:600}

.sec{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:8px;overflow:hidden}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:8px 10px 8px 14px;gap:8px}
.sec-h h3{margin:0;font:italic 500 21px/1.1 'Cormorant Garamond',Georgia,serif}
.add{border:0;background:var(--olive-soft);color:var(--olive-2);border-radius:999px;padding:7px 12px 7px 9px;font-weight:600;font-size:14px;display:flex;align-items:center;gap:4px}
.add svg{width:17px;height:17px}
.it{display:flex;align-items:center;border-top:1px solid var(--line);padding:2px 4px 2px 14px}
.it .nm{flex:1;border:0;background:none;text-align:left;padding:9px 0;font-size:15px;min-width:0}
.it .ib{width:36px;height:36px}
.it .ib svg{width:18px;height:18px}

.drow,.trow,.crow{width:100%;display:flex;align-items:center;gap:12px;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 14px;text-align:left;font-size:15px}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list>:last-child{border-bottom:0}
.drow span,.trow>span:nth-child(2),.crow>span{flex:1;min-width:0}
.trow small,.crow small{display:block;font-size:13px;color:var(--muted)}
.trow .sw{width:44px;height:56px;margin:0;border-radius:6px}
.trow .sw img{width:32px}
.trow>svg,.drow>svg{width:18px;height:18px;color:var(--muted);flex:none}
.crow{padding:6px 4px 6px 14px}
.dcat{font:italic 500 20px/1.2 'Cormorant Garamond',Georgia,serif;margin:18px 2px 8px}
.search{margin-bottom:12px}

.pv{position:relative;overflow:hidden;margin:4px 0 16px}
.pv-scale{transform-origin:0 0;width:max-content}
.pv .pg{box-shadow:0 10px 30px rgba(34,40,31,.2)}
.rng{display:flex;align-items:center;gap:10px;font-size:14px;margin-bottom:6px}
.rng span:first-child{width:78px;color:var(--muted)}
.rng input{flex:1;accent-color:var(--olive)}
.rng b{width:40px;text-align:right;font-weight:600}
.clr{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.clr input{width:44px;height:36px;border:1px solid var(--line);border-radius:8px;padding:2px;background:#fff}

.shbg{position:fixed;inset:0;background:rgba(20,24,18,.38);z-index:60}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:#fff;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;padding:12px 16px calc(16px + var(--sb));max-width:720px;margin:0 auto;animation:up .22s ease-out;-webkit-overflow-scrolling:touch}
@keyframes up{from{transform:translateY(28px);opacity:.5}}
.sh-h{display:flex;align-items:center;justify-content:space-between;margin:0 -6px 10px 0}
.sh-h h3{margin:0;font:italic 500 26px/1.1 'Cormorant Garamond',Georgia,serif}
.pk{width:100%;display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 4px;text-align:left;font-size:15px}
.pk span{flex:1}
.pk small{display:block;font-size:12px;color:var(--muted)}
.pk i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);flex:none}
.pk i svg{width:16px;height:16px}
.pk.on i{background:var(--olive);border-color:var(--olive);color:#fff}
.pk.on{font-weight:600}
#pklist{max-height:44vh;overflow:auto;margin:6px 0 12px}
.pk-new{display:flex;gap:8px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(150px + var(--sb));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:90;max-width:88vw;text-align:center}
.busy{position:fixed;inset:0;background:rgba(250,250,246,.94);z-index:80;display:grid;place-items:center;text-align:center;font-weight:600;color:var(--olive-2)}
.spin{width:38px;height:38px;border:3px solid var(--olive-soft);border-top-color:var(--olive);border-radius:50%;margin:0 auto 12px;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.spin{animation-duration:2s}}

/* Chip preimpostati */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 12px}
.chips button{border:1px dashed var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:13px;text-align:left;color:var(--olive-2)}
.tchip .sw,.trow .sw{background-size:contain;background-repeat:no-repeat;background-position:center}

.pg-e{font-family:Antic,sans-serif}
.pg-c{font-family:'Cormorant Garamond',serif;font-weight:400}
.c-venue{position:absolute;left:0;right:0;top:11.6px;font-size:25px;font-weight:700;line-height:1.21}
.c-tag{position:absolute;left:0;right:0;top:35.3px;font-size:18px;line-height:1.21}

.alg{font-size:.6em;position:relative;top:-.55em;margin-left:.2em;letter-spacing:.03em;white-space:nowrap}
.alg-l{font-size:.72em;margin-top:.6em;opacity:.85}
.algs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}

.algs button.on{background:var(--olive);border-color:var(--olive);color:#fff}
.c-title{position:absolute;left:30px;right:30px;top:67.9px;font-size:25px;font-weight:700;line-height:1.21;white-space:nowrap;overflow:hidden}
.c-sub{position:absolute;left:0;right:0;top:106.4px;font-size:28px;font-weight:700;line-height:1.21}
.c-flow{position:absolute;left:55px;right:55px;top:151px}
.c-in{font-size:17px}
.c-sec-t{font-size:1.1765em;font-weight:700;line-height:1.21}
.c-sec+.c-sec{margin-top:1.53em}
.c-sec+.c-sec.nt{margin-top:1.1em}
.c-it{line-height:1.21;margin-bottom:.376em;white-space:pre-line}
.c-offer{margin-top:1.3em;line-height:1.3}
.c-drinks{position:absolute;left:16.4px;top:706px;font-size:18px;line-height:.917;text-align:left;white-space:pre-line}
/* Ostie e fattoria didattica */
.ost-cv{width:100%;height:auto;display:block;border-radius:12px;background:#fff;border:1px solid var(--line);margin-bottom:14px}
.fcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;margin-bottom:12px}

.e-notes{margin-top:.5em;font-style:italic;font-size:.92em}

const idb={
  _p:null,
  open(){return this._p||(this._p=new Promise((res,rej)=>{const r=indexedDB.open('menu-app',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const db=await this.open();return new Promise((res,rej)=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async set(k,v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error)})}
};
let state,saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(flush,250)}
function flush(){clearTimeout(saveT);saveT=null;if(state)idb.set('state',state).catch(()=>toast('Salvataggio non riuscito: memoria del telefono piena?'))}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&saveT)flush()});
function normalize(s){
  const d=defaultState();
  if(!s||(s.v!==2&&s.v!==3))return d; // dati della versione di prova precedente: si riparte puliti
  // template di serie: fondo bianco per la stampa e aggiunta dei nuovi (es. Pasqua)
  if(Array.isArray(s.templates)){
    const byId=Object.fromEntries(d.templates.map(t=>[t.id,t]));
    s.templates.forEach(t=>{const b=byId[t.id];
      if(t.id==='tpl-pasqua'&&t.name==='Festività – Pasqua'){t.name=b.name;if(t.heading==='Pasqua 2026')t.heading=b.heading}
      if(b&&t.layout==='classico'&&t.tagline===undefined){t.tagline=b.tagline;t.legend=true}
      if(b&&t.builtIn&&(t.priceAdult===''||t.priceAdult===undefined)){t.priceAdult=b.priceAdult;if(t.priceKid===''||t.priceKid===undefined)t.priceKid=b.priceKid}
      if(b&&t.builtIn){t.bgColor=b.bgColor;if(!t.bgImage||t.bgImage===t.origBg)t.bgImage=b.bgImage;t.origBg=b.origBg}});
    d.templates.forEach(b=>{if(!s.templates.some(t=>t.id===b.id))s.templates.push(b)});
    const ord=d.templates.map(t=>t.id),pos=t=>{const i=ord.indexOf(t.id);return i<0?999:i};
    s.templates=s.templates.map((t,i)=>[t,i]).sort((a,b)=>pos(a[0])-pos(b[0])||a[1]-b[1]).map(x=>x[0]); // nuovi template al loro posto, quelli creati da te in fondo
  }
  return{v:3,didattica:s.didattica||{},lastOstia:s.lastOstia||null,settings:{...d.settings,...(s.settings||{})},
    categories:Array.isArray(s.categories)&&s.categories.length?s.categories:d.categories,
    dishes:Array.isArray(s.dishes)?s.dishes:d.dishes,
    templates:Array.isArray(s.templates)&&s.templates.length?s.templates.map(t=>({...SUNDAY,limit:1240,bgColor:'#FFFFFF',ink:'#333333',...t})):d.templates,
    menus:Array.isArray(s.menus)?s.menus:[]};
}

function algLegend(m,secs){
  if(!m.allergens)return'';
  const u=[...new Set(secs.flatMap(s=>s.items.flatMap(algNums)))].sort((a,b)=>a-b);
  return u.length?`<div class="alg-l">Allergeni: ${u.map(n=>`${n} ${ALLERGENI[n-1]}`).join(' · ')}</div>`:'';

function pageVerticale(m,t,mode){

  if(!secs.length)flow=`<div class="v-empty">Aggiungi le portate per comporre il menù</div>`;
  const foot=[String(val(m,'drinks')).trim(),...(mode==='proposta'?priceLines(m):[])].filter(Boolean);
  const al=algLegend(m,secs);

    while(inn.offsetHeight>f.clientHeight&&k>.45&&n++<90){k*=.97;inn.style.fontSize=(17*k)+'px'}
  }else if(pg.classList.contains('pg-v')){

    while(inn.offsetHeight>f.clientHeight&&k>.45&&n++<90){k*=.97;inn.style.fontSize=(19*k)+'px'}
  }else{
    const cols=[...pg.querySelectorAll('.e-col')];
    cols.forEach(c=>{const h=c.querySelector('.e-h');let fs=19.5;h.style.fontSize=fs+'px';while(h.scrollWidth>h.clientWidth+1&&fs>12){fs--;h.style.fontSize=fs+'px'}

/* ---------- PDF ---------- */
async function makeImage(m,mode){
  const canvas=await makePDF(m,mode,true);
  return await new Promise(r=>canvas.toBlob(r,'image/jpeg',0.9));
}
async function makePDF(m,mode,asCanvas){
  if(!window.html2canvas||!window.jspdf)throw new Error('librerie non caricate. Riapri l\'app.');
  await loadFonts();
  const t=tplOf(m),L=layoutOf(m),host=$('#rh');host.innerHTML=pageHTML(m,t,mode);
  const pg=host.firstElementChild;fitPage(pg);
  if(t.bgImage)await new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=t.bgImage});
  try{
    const canvas=await html2canvas(pg,{scale:L.scale,backgroundColor:t.bgColor||'#ffffff',useCORS:true,logging:false,scrollX:0,scrollY:0});
    if(asCanvas)return canvas;
    const w=L.w*PT_MM,h=L.h*PT_MM;
    const pdf=new window.jspdf.jsPDF({orientation:w>h?'l':'p',unit:'mm',format:[w,h]});
    pdf.addImage(canvas.toDataURL('image/jpeg',0.92),'JPEG',0,0,w,h);
    return pdf.output('blob');
  }finally{host.innerHTML=''}
}
async function doPDF(){
  const m=getMenu(ui.editId);if(!m)return;const mode=ui.pv.mode;
  busy(true,'Creo il PDF');
  try{
    const blob=await makePDF(m,mode);
    const name=`${mode==='tavolo'?'Menu-tavolo':'Proposta'}_${slug(heading(m)+' '+(m.client||''))}_${fmtDash(m.date)||'senza-data'}.pdf`;
    ui.sheet={type:'file',blob,name,mime:'application/pdf',title:mode==='tavolo'?'Menù tavolo pronto':'Proposta pronta'};
  }catch(e){toast('PDF non creato: '+(e.message||e))}
  finally{busy(false);renderSheet()}
}
const AND=window.Android&&window.Android.saveFile?window.Android:null;
const b64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=()=>rej(r.error);r.readAsDataURL(b)});
async function shareFile(){
  const s=ui.sheet;
  if(AND){try{AND.saveFile(await b64(s.blob),s.name,s.mime,true)}catch(e){toast('Condivisione non riuscita')}return}
  const file=new File([s.blob],s.name,{type:s.mime});
  try{await navigator.share({files:[file],title:s.name})}catch(e){if(e.name!=='AbortError')downloadFile()}
}
async function downloadFile(){
  const s=ui.sheet;
  if(AND){try{AND.saveFile(await b64(s.blob),s.name,s.mime,false)}catch(e){toast('Salvataggio non riuscito')}return}
  const u=URL.createObjectURL(s.blob),a=document.createElement('a');
  a.href=u;a.download=s.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);
}

/* ---------- Invio su WhatsApp ---------- */
const waPhone=p=>{let d=String(p||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(d.length===10&&d[0]==='3')d='39'+d;return d};
async function sendFiles(files,text,phone,wa){
  const tel=waPhone(phone);
  if(text&&!AND){try{await navigator.clipboard.writeText(text)}catch(e){}}
  if(AND&&AND.shareFiles){
    const arr=await Promise.all(files.map(async f=>({name:f.name,mime:f.mime,data:await b64(f.blob)})));
    AND.shareFiles(JSON.stringify({files:arr,text,whatsapp:!!wa,phone:tel}));return;
  }
  if(AND&&files.length===1){AND.saveFile(await b64(files[0].blob),files[0].name,files[0].mime,true);return} // APK precedenti
  const F=files.map(f=>new File([f.blob],f.name,{type:f.mime}));
  try{if(navigator.canShare&&navigator.canShare({files:F})){await navigator.share({files:F,text});return}}
  catch(e){if(e.name==='AbortError')return}
  // browser senza condivisione di file: scarico i file e apro la chat con il testo
  files.forEach(f=>{const u=URL.createObjectURL(f.blob),a=document.createElement('a');a.href=u;a.download=f.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)});
  if(wa)window.open(`https://wa.me/${tel}?text=${encodeURIComponent(text)}`,'_blank');
}
function menuMsg(m,mode){
  const v=state.settings.venue||'Tenuta Coppa',quando=m.date?` per ${fmtLong(m.date).replace(/^./,c=>c.toLowerCase())}`:'';
  const g=[m.guests?m.guests+' adulti':'',m.guestsKids?m.guestsKids+' bambini':''].filter(Boolean).join(' e ');
  const ciao=`Buongiorno${m.client?' '+m.client:''},`;
  if(mode==='tavolo')return`${ciao}\nle invio il menù${quando}.\nUn cordiale saluto,\n${v}`;
  const pa=num(val(m,'priceAdult')),pk=num(val(m,'priceKid'));
  let r=`${ciao}\ncome d'accordo le invio la proposta di menù${quando}${g?` (${g})`:''}.`;
  if(pa!=='')r+=`\nIl costo è di ${eurC(pa)} a persona${pk!==''&&Number(m.guestsKids)>0?` e ${eurC(pk)} per i bambini`:''}.`;
  return r+`\nResto a disposizione per qualsiasi modifica.\nUn cordiale saluto,\n${v}`;
}

async function waFile(m,mode,fmt){

function newOstia(type){const p=OSTIA_TYPES[type||'compleanno'];return{type:type||'compleanno',shape:'tonda',top:p.top,main:p.main,name:'',extra:'',cut:true}}
const ost=()=>ui.ost||(ui.ost=state.lastOstia?{...state.lastOstia}:newOstia());
function drawOstia(cv,o,W){
  const S=OSTIA_SHAPES[o.shape]||OSTIA_SHAPES.tonda,H=Math.round(W*S.h/S.w),px=W/S.w;
  cv.width=W;cv.height=H;const x=cv.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,W,H);
  if(o.cut){ // linea di taglio tratteggiata, come nei file per la pasticceria
    x.save();x.strokeStyle='#C7C7C7';x.lineWidth=Math.max(1,.3*px);x.setLineDash([2.2*px,1.6*px]);x.beginPath();
    if(o.shape==='tonda')x.arc(W/2,H/2,100*px,0,Math.PI*2);
    else{const m=5*px,r=4*px,w=W-2*m,h=H-2*m;x.moveTo(m+r,m);x.arcTo(m+w,m,m+w,m+h,r);x.arcTo(m+w,m+h,m,m+h,r);x.arcTo(m,m+h,m,m,r);x.arcTo(m,m,m+w,m,r);x.closePath()}
    x.stroke();x.restore();
  }
  const L=[[o.top,.6],[o.main,1],[o.name,1],[o.extra,.45]].map(([t,k])=>[String(t||'').trim(),k]).filter(l=>l[0]);
  if(!L.length)return;
  const tonda=o.shape==='tonda',bw=(tonda?138:235)*px,bh=(tonda?112:140)*px,cap=(tonda?34:40)*px,LH=1.02;
  x.font='100px "Great Vibes"';const wu=L.map(([t])=>x.measureText(t).width/100);
  const k=Math.min(cap,bh/L.reduce((a,[,s])=>a+s*LH,0),...L.map(([,s],i)=>bw/(s*wu[i])));
  let y=H/2-L.reduce((a,[,s])=>a+k*s*LH,0)/2;
  x.fillStyle=GOLD;x.textAlign='center';x.textBaseline='alphabetic';
  L.forEach(([t,s])=>{const fs=k*s;x.font=`${fs}px "Great Vibes"`;x.fillText(t,W/2,y+fs*LH*.8);y+=fs*LH});
}
async function paintOstia(){
  const cv=$('#ostcv');if(!cv)return;
  await document.fonts.load('40px "Great Vibes"').catch(()=>{});
  drawOstia(cv,ost(),ost().shape==='tonda'?900:1200);
}
const ostName=(o,ext)=>`Ostia-${o.type}${o.name?'-'+slug(o.name):''}.${ext}`;
async function ostiaFile(fmt){
  const o=ost(),S=OSTIA_SHAPES[o.shape];
  await document.fonts.load('40px "Great Vibes"').catch(()=>{});
  const cv=document.createElement('canvas');drawOstia(cv,o,Math.round(S.w/25.4*300)); // 300 dpi, misura reale
  state.lastOstia={...o};save();
  if(fmt==='png'){const blob=await new Promise(r=>cv.toBlob(r,'image/png'));return{blob,name:ostName(o,'png'),mime:'image/png'}}
  const pdf=new window.jspdf.jsPDF({orientation:S.w>S.h?'l':'p',unit:'mm',format:[S.w,S.h]});
  pdf.addImage(cv.toDataURL('image/png'),'PNG',0,0,S.w,S.h);
  return{blob:pdf.output('blob'),name:ostName(o,'pdf'),mime:'application/pdf'};
}

    <label class="fld"><span>Categoria</span><select class="inp" id="dcat">${allCats().map(c=>`<option ${c===d.cat?'selected':''}>${esc(c)}</option>`).join('')}</select></label>
    <div class="btns ${sh.id?'two':''}"><button class="btn pri" data-a="saveDish">Salva</button>${sh.id?`<button class="btn danger" data-a="delDish">${I.trash}Elimina</button>`:''}</div>
    ${sh.id?'<p class="hint">Modifiche ed eliminazioni non toccano i menù già composti.</p>':''}`;
  }else if(sh.type==='item'){
    const it=secList(getMenu(ui.editId),sh.kids)[sh.s].items[sh.i];
    h=head('Portata in questo menù')+`
    <label class="fld"><span>Testo stampato</span><textarea class="inp" id="iname" rows="3" style="min-height:90px">${esc(it.name)}</textarea></label>
    <p class="hint" style="margin:-6px 2px 12px">La modifica vale solo per questo menù, l'archivio resta com'è.</p>
    <button class="btn pri wide" data-a="saveItem">Salva</button>`;
  }else if(sh.type==='wa'){
    h=head(sh.title)+(sh.menuId?`<div class="seg" style="margin-bottom:8px"><button class="${sh.fmt!=='pdf'?'on':''}" data-a="waFmt" data-v="img">Immagine</button><button class="${sh.fmt==='pdf'?'on':''}" data-a="waFmt" data-v="pdf">PDF</button></div>
    <p class="hint" style="margin:0 2px 12px">${sh.fmt==='pdf'?'Il PDF è adatto se il cliente deve stamparlo. WhatsApp potrebbe non mostrare il messaggio sotto al file: in quel caso incollalo tu.':'L\'immagine si vede subito in chat e il messaggio compare sempre come didascalia.'}</p>`:'')+`<p class="hint" style="margin-bottom:12px;word-break:break-all">${sh.files.map(f=>esc(f.name)).join('<br>')}</p>
    <label class="fld"><span>Numero WhatsApp (facoltativo)</span><input class="inp" type="tel" id="waphone" value="${esc(sh.phone)}" placeholder="Se lo lasci vuoto scegli tu la chat"></label>
    <label class="fld"><span>Messaggio</span><textarea class="inp" id="watext" rows="7" style="min-height:160px">${esc(sh.text)}</textarea></label>
    <div class="btns"><button class="btn wa" data-a="waSend">${I.wa}Apri WhatsApp</button><button class="btn" data-a="waOther">${I.share}Invia con un'altra app</button></div>
    <p class="hint" style="margin-top:10px">Il messaggio viene copiato anche negli appunti: se WhatsApp non lo mostra sotto al file, tieni premuto nel campo di testo e scegli Incolla.</p>`;
  }else if(sh.type==='file'){
    const cs=canShareFiles();
    h=head(sh.title)+`<p class="hint" style="margin-bottom:14px;word-break:break-all">${esc(sh.name)}</p>
    <div class="btns">${cs?`<button class="btn pri" data-a="shareFile">${I.share}Condividi (WhatsApp, email, stampa…)</button>`:''}<button class="btn ${cs?'':'pri'}" data-a="downloadFile">${I.dl}Scarica</button></div>`;
  }
  el.innerHTML=`<div class="shbg" data-a="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true">${h}</div>`;
  if(sh.type==='dish'&&!sh.id)setTimeout(()=>$('#dname')?.focus(),250);
}

/* ---------- Render ---------- */
function render(keep){
  const y=window.scrollY;
  const V={cal:vCal,list:vList,dishes:vDishes,settings:vSettings,edit:vEdit,preview:vPreview,tpl:vTpl,ostie:vOstie,didattica:vDidattica};
  $('#app').innerHTML=(V[ui.view]||vCal)();
  window.scrollTo(0,keep?y:0);
  mountPreviews();
  if(ui.view==='ostie')paintOstia();
}
let toastT;
function toast(msg){let t=$('.toast');if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t)}t.textContent=msg;clearTimeout(toastT);toastT=setTimeout(()=>t.remove(),3400)}
function busy(on,msg){let b=$('.busy');if(on){if(!b){b=document.createElement('div');b.className='busy';document.body.appendChild(b)}b.innerHTML=`<div><div class="spin"></div>${esc(msg)}</div>`}else b?.remove()}
function leaveEdit(){
  if(ui.view!=='edit')return;
  const m=getMenu(ui.editId);
  if(m&&isEmptyMenu(m)){state.menus=state.menus.filter(x=>x!==m);save()}
}
function openEditor(id){ui.back=['cal','list'].includes(ui.view)?ui.view:ui.back;ui.editId=id;ui.view='edit';render()}

/* ---------- Azioni ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,d=b.dataset,m=ui.editId?getMenu(ui.editId):null,K=!!d.k;
  switch(a){
    case 'nav':leaveEdit();ui.view=d.v;render();break;
    case 'calMove':{let mm=ui.cal.m+Number(d.d),yy=ui.cal.y;if(mm<0){mm=11;yy--}if(mm>11){mm=0;yy++}ui.cal={y:yy,m:mm};render(true);break}
    case 'calToday':{const n=new Date();ui.cal={y:n.getFullYear(),m:n.getMonth()};ui.selDate=today();render();break}
    case 'selDay':ui.selDate=d.d;render(true);break;
    case 'new':{const nm=newMenu(ui.view==='cal'?ui.selDate:today());state.menus.push(nm);save();openEditor(nm.id);break}
    case 'open':openEditor(d.id);break;
    case 'back':
      if(ui.view==='edit'){leaveEdit();ui.view=ui.back||'cal';if(m&&m.date&&ui.view==='cal'){const dt=parseD(m.date);ui.selDate=m.date;ui.cal={y:dt.getFullYear(),m:dt.getMonth()}}}
      else if(ui.view==='preview')ui.view='edit';
      else if(ui.view==='tpl'||ui.view==='dishes')ui.view='settings';
      render();break;
    case 'setTpl':if(m){m.templateId=d.id;save();render(true)}break;
    case 'setStatus':if(m){m.status=d.v;save();render(true)}break;
    case 'pick':ui.sheet={type:'picker',s:+d.s,kids:K};ui.pickQ='';ui.pickAll=false;renderSheet();break;
    case 'pickToggle':{
      const s=curSec(),x=state.dishes.find(z=>z.id===d.id);if(!x)break;
      const i=s.items.findIndex(z=>z.dishId===x.id);
      if(i>=0)s.items.splice(i,1);else s.items.push({dishId:x.id,name:x.name});
      save();$('#pklist').innerHTML=pickListHTML();render(true);break}
    case 'pickNew':{
      const inp=$('#pknew'),name=inp.value.trim();if(!name)break;
      const s=curSec(),cat=ui.sheet.kids?KIDS_CAT:(state.categories.includes(s.name)?s.name:state.categories[0]);
      let x=state.dishes.find(z=>norm(z.name)===norm(name)&&z.cat===cat);
      if(!x){x={id:uid(),name,cat};state.dishes.push(x)}
      if(!s.items.some(z=>z.dishId===x.id))s.items.push({dishId:x.id,name:x.name});
      inp.value='';save();$('#pklist').innerHTML=pickListHTML();render(true);toast("Portata aggiunta al menù e all'archivio");break}
    case 'itMove':{const L=secList(m,K)[+d.s].items,i=+d.i,j=i+Number(d.d);if(j<0||j>=L.length)break;[L[i],L[j]]=[L[j],L[i]];save();render(true);break}
    case 'itDel':secList(m,K)[+d.s].items.splice(+d.i,1);save();render(true);break;
    case 'itEdit':ui.sheet={type:'item',s:+d.s,i:+d.i,kids:K};renderSheet();break;
    case 'saveItem':{const v=$('#iname').value.trim();if(v){secList(m,ui.sheet.kids)[ui.sheet.s].items[ui.sheet.i].name=v;save()}ui.sheet=null;renderSheet();render(true);break}
    case 'drPick':{const p=state.settings.drinkPresets[+d.i],cur=String(val(m,d.f)).trim();m[d.f]=cur?cur+'\n'+p:p;save();render(true);break}
    case 'preview':ui.pv={mode:d.mode||'tavolo'};ui.view='preview';render();break;
    case 'pvMode':ui.pv.mode=d.v;render(true);break;
    case 'pdf':if(prezzoOk())doPDF();break;
    case 'shareFile':shareFile();break;
    case 'downloadFile':downloadFile();break;
    case 'dup':{const c=clone(m);c.id=uid();c.created=Date.now();c.status='bozza';state.menus.push(c);save();ui.editId=c.id;render();toast('Menù duplicato: cambia data e cliente');break}
    case 'del':if(confirm('Eliminare questo menù?')){state.menus=state.menus.filter(x=>x!==m);save();ui.view=ui.back||'cal';render();toast('Menù eliminato')}break;
    case 'listTab':ui.listTab=d.v;render(true);break;
    case 'editDish':{const x=d.id&&state.dishes.find(z=>z.id===d.id);ui.sheet={type:'dish',id:d.id||null,alg:[...(x&&x.alg||[])]};renderSheet();break}
    case 'algT':{const n=+d.n,A=ui.sheet.alg,i=A.indexOf(n);i<0?A.push(n):A.splice(i,1);A.sort((a,b)=>a-b);b.classList.toggle('on',i<0);break}
    case 'saveDish':{
      const name=$('#dname').value.trim(),cat=$('#dcat').value;if(!name){toast('Scrivi il nome della portata');break}
      const alg=[...(ui.sheet.alg||[])];
      if(ui.sheet.id){const x=state.dishes.find(z=>z.id===ui.sheet.id);x.name=name;x.cat=cat;x.alg=alg}else state.dishes.push({id:uid(),name,cat,alg});
      save();ui.sheet=null;renderSheet();render(true);toast('Portata salvata');break}
    case 'delDish':if(confirm("Eliminare questa portata dall'archivio?")){state.dishes=state.dishes.filter(z=>z.id!==ui.sheet.id);save();ui.sheet=null;renderSheet();render(true)}break;
    case 'closeSheet':ui.sheet=null;renderSheet();break;
    case 'waMenu':if(prezzoOk())waMenu();break;
    case 'waFmt':if(ui.sheet.fmt!==d.v){state.settings.waFmt=d.v;save();waMenu(d.v)}break;
    case 'waSend':case 'waOther':{const sh=ui.sheet;sh.text=$('#watext').value;sh.phone=$('#waphone').value;sendFiles(sh.files,sh.text,sh.phone,a==='waSend');
      if(sh.menuId){const mm=getMenu(sh.menuId);if(mm){if(mm.status==='bozza'&&sh.mode==='proposta'){mm.status='inviata';toast('Proposta segnata come inviata')}if(!mm.phone&&sh.phone)mm.phone=sh.phone;save()}}
      break}
    case 'ostType':{const o=ost(),p=OSTIA_TYPES[d.v];o.type=d.v;o.top=p.top;o.main=p.main;render(true);break}
    case 'ostShape':ost().shape=d.v;render(true);break;
    case 'ostWA':(async()=>{busy(true,'Preparo il file');try{const f=await ostiaFile('png'),o=ost();
      ui.sheet={type:'wa',title:"Invia l'ostia",files:[f],phone:'',text:`Buongiorno,\nvi invio il file per l'ostia ${OSTIA_SHAPES[o.shape].l.toLowerCase()}${o.name?` (${o.name})`:''}.\nGrazie mille,\n${state.settings.venue||'Tenuta Coppa'}`}}
      catch(err){toast('File non creato')}finally{busy(false);renderSheet()}})();break;
    case 'ostFile':(async()=>{busy(true,'Preparo il file');try{const f=await ostiaFile(d.v);ui.sheet={type:'file',blob:f.blob,name:f.name,mime:f.mime,title:'Ostia pronta'}}
      catch(err){toast('File non creato')}finally{busy(false);renderSheet()}})();break;
    case 'didWA':(async()=>{busy(true,'Preparo i file');try{const fs=await Promise.all(DID_FILES.map(x=>didBlob(x.k)));busy(false);await sendFiles(fs,state.settings.didMsg||DID_MSG,ui.didPhone,true)}
      catch(err){toast('File non disponibili')}finally{busy(false)}})();break;
    case 'didShare':(async()=>{try{await sendFiles([await didBlob(d.k)],'','',false)}catch(err){toast('File non disponibile')}})();break;
    case 'didReplace':ui.didSlot=d.k;$('#didfile').click();break;
    case 'didReset':delete state.didattica[d.k];save();render(true);toast('Ripristinato il file originale');break;
    case 'editTpl':ui.tplId=d.id;ui.view='tpl';render();break;
    case 'dupTpl':{const t=clone(getTpl(ui.tplId));t.id='tpl-'+uid();t.name=t.name+' (copia)';t.builtIn=false;state.templates.push(t);save();ui.tplId=t.id;render();toast('Template duplicato: cambia nome e titolo');break}
    case 'delTpl':{const t=getTpl(ui.tplId),used=state.menus.filter(x=>x.templateId===t.id).length;
      if(confirm(`Eliminare il template "${t.name}"?${used?`\n${used} menù useranno il primo template della lista.`:''}`)){state.templates=state.templates.filter(x=>x!==t);save();ui.view='settings';render()}break}
    case 'tplBg':$('#bgfile').click();break;
    case 'tplBgReset':{const t=getTpl(ui.tplId);t.bgImage=t.origBg;save();render(true);break}
    case 'catMove':{const L=state.categories,i=+d.i,j=i+Number(d.d);if(j<0||j>=L.length)break;[L[i],L[j]]=[L[j],L[i]];save();render(true);break}
    case 'catRen':{const old=state.categories[+d.i],v=prompt('Nuovo nome della sezione',old);if(!v||!v.trim()||v.trim()===old)break;
      if(allCats().includes(v.trim())){toast('Esiste già una sezione con questo nome');break}
      state.categories[+d.i]=v.trim();state.dishes.forEach(x=>{if(x.cat===old)x.cat=v.trim()});save();render(true);break}
    case 'catDel':{const c=state.categories[+d.i],n=state.dishes.filter(x=>x.cat===c).length;
      if(n){alert(`Nella sezione "${c}" ci sono ${n} portate. Spostale in un'altra sezione o eliminale prima.`);break}
      if(state.categories.length<2)break;
      if(confirm(`Eliminare la sezione "${c}"?`)){state.categories.splice(+d.i,1);save();render(true)}break}
    case 'catAdd':{const v=$('#newcat').value.trim();if(!v)break;if(allCats().includes(v)){toast('Sezione già presente');break}state.categories.push(v);save();render(true);break}
    case 'drAdd':{const v=$('#newdrink').value.trim();if(!v)break;state.settings.drinkPresets.push(v);save();render(true);break}
    case 'drDel':state.settings.drinkPresets.splice(+d.i,1);save();render(true);break;
    case 'export':{state.settings.lastBackup=Date.now();save();const blob=new Blob([JSON.stringify(state)],{type:'application/json'});ui.sheet={type:'file',blob,name:`backup-menu_${fmtDash(today())}.json`,mime:'application/json',title:'Backup pronto'};renderSheet();break}
    case 'import':$('#importfile').click();break;
  }
});
document.addEventListener('input',e=>{
  const el=e.target,d=el.dataset;
  if(d.f){
    const m=getMenu(ui.editId);if(!m)return;let v=el.value;
    if(d.f==='guests'||d.f==='guestsKids')v=v===''?'':Math.max(0,parseInt(v,10)||0);
    if(d.f==='priceAdult'||d.f==='priceKid')v=v.trim()===''?'':num(v);
    m[d.f]=v;save();
    if(/price|guests/.test(d.f)){const t=$('#tot');if(t)t.textContent=totText(m)}
    if(d.f==='heading'){const h=$('.top h1');if(h)h.textContent=heading(m)}
    if(d.pv){clearTimeout(ui.pvT);ui.pvT=setTimeout(mountPreviews,350)} // aggiorno l'anteprima mentre scrivi il prezzo
  }else if(d.sf){state.settings[d.sf]=el.value;save()}
  else if(d.tf){const t=getTpl(ui.tplId);let v=el.value;if(d.tf==='priceAdult'||d.tf==='priceKid')v=v.trim()===''?'':num(v);t[d.tf]=v;save();mountPreviews();if(d.tf==='name'){const h=$('.top h1');if(h)h.textContent=el.value}}
  else if(d.tl){const t=getTpl(ui.tplId);t.limit=Number(el.value);$('#tl').textContent=Math.round(t.limit/14.4)+'%';save();mountPreviews()}
  else if(d.in==='q'){ui.q=el.value;$('#mlist').innerHTML=listHTML()}
  else if(d.in==='didPhone'){ui.didPhone=el.value}
  else if(d.of){ost()[d.of]=el.value;paintOstia()}
  else if(d.in==='dq'){ui.dq=el.value;$('#dlist').innerHTML=dishListHTML()}
  else if(d.in==='pickQ'){ui.pickQ=el.value;$('#pklist').innerHTML=pickListHTML()}
});
document.addEventListener('change',async e=>{
  const el=e.target,d=el.dataset;
  if(d.fc){const m=getMenu(ui.editId);if(m){m[d.fc]=el.checked;save();if(d.re)render(true)}}
  else if(d.pk==='all'){ui.pickAll=el.checked;$('#pklist').innerHTML=pickListHTML()}
  else if(d.oc){ost()[d.oc]=el.checked;paintOstia()}
  else if(el.id==='didfile'&&el.files[0]){
    const file=el.files[0],slot=ui.didSlot;
    const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(file)});
    state.didattica=state.didattica||{};state.didattica[slot]={name:file.name,mime:file.type||'application/octet-stream',data};
    save();render(true);toast('File aggiornato');el.value='';
  }
  else if(el.id==='bgfile'&&el.files[0]){await setBg(el.files[0]);el.value=''}
  else if(el.id==='importfile'&&el.files[0]){await applyBackup(await el.files[0].text());el.value=''}
});
async function setBg(src){
  try{
    const r=await readImage(src),t=getTpl(ui.tplId),L=LAYOUTS[t.layout]||LAYOUTS.verticale;
    t.bgImage=r.url;save();render(true);
    if(Math.abs(r.w/r.h-L.w/L.h)>0.03)toast("L'immagine ha proporzioni diverse dal template: verrà deformata. Esportala da Canva nello stesso formato.");
  }catch(err){toast(err.message)}
}
async function applyBackup(text){
  try{
    const obj=JSON.parse(text);
    if(!obj||!Array.isArray(obj.menus)||!Array.isArray(obj.dishes))throw new Error('Il file non è un backup di questa app.');
    if(confirm(`Il backup contiene ${obj.menus.length} menù e ${obj.dishes.length} portate. Sostituire i dati attuali?`)){state=normalize(obj);flush();render();toast('Backup importato')}
  }catch(err){toast(err.message||'File non valido')}
}

document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  const map={pknew:'pickNew',newcat:'catAdd',newdrink:'drAdd'};
  if(map[e.target.id]){e.preventDefault();$(`[data-a="${map[e.target.id]}"]`).click()}
});
function readImage(src){ // accetta un File oppure un data URI (dall'app Android)
  return new Promise((res,rej)=>{
    const done=url=>{const img=new Image();img.onload=()=>{
      const k=Math.min(1,2600/Math.max(img.width,img.height)),w=Math.round(img.width*k),h=Math.round(img.height*k);
      const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      res({url:c.toDataURL('image/jpeg',0.88),w,h})};
      img.onerror=()=>rej(new Error('Immagine non leggibile. Usa un PNG o JPG.'));img.src=url};
    if(typeof src==='string')return done(src);
    const r=new FileReader();r.onload=()=>done(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(src);
  });
}
let rzT;window.addEventListener('resize',()=>{clearTimeout(rzT);rzT=setTimeout(mountPreviews,150)});

/* ---------- Avvio ---------- */
(async()=>{
  try{const s=await idb.get('state');state=normalize(s);if(!s||s.v!==2)flush()}
  catch(e){state=normalize(null);toast('Archivio non disponibile: i dati non verranno salvati')}
  render();
  loadFonts().then(mountPreviews);
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if(!AND&&'serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
